<!-- NAV -->
<nav>
    <a class="nav-logo" href="#">Magic Animals</a>
    
    <!-- Mobile Menu Toggle -->
    <button class="nav-toggle" aria-label="menu toggle" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <ul class="nav-links">
      <li><a href="/index/">Accueil</a></li>
      <li><a href="/a-propos/">A Propos</a></li>
      <li><a href="/services/">Services</a></li>
      <li><a href="/galerie/">Galerie</a></li>

    </ul>
    <a href="/contact/" class="nav-cta">Prendre rendez-vous</a>
  </nav>
<script>
  // Mobile Navigation Toggle
const navToggle = document.querySelector('.nav-toggle');
const navLinks = document.querySelector('.nav-links');
const navLinksItems = document.querySelectorAll('.nav-links a');

function toggleMenu() {
    const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
    navToggle.setAttribute('aria-expanded', !isExpanded);
    navToggle.classList.toggle('active');
    navLinks.classList.toggle('active');
    
    // Prevent body scroll when menu is open
    document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : '';
}

// Toggle menu on button click
if (navToggle) {
    navToggle.addEventListener('click', toggleMenu);
}

// Close menu when clicking a link
navLinksItems.forEach(link => {
    link.addEventListener('click', (e) => {
        if (window.innerWidth < 1024) {
            toggleMenu();
        }
    });
});

// Close menu on window resize (if going from mobile to desktop)
window.addEventListener('resize', () => {
    if (window.innerWidth >= 1024) {
        if (navLinks.classList.contains('active')) {
            navToggle.setAttribute('aria-expanded', 'false');
            navToggle.classList.remove('active');
            navLinks.classList.remove('active');
            document.body.style.overflow = '';
        }
    }
});

// Close menu when clicking outside (optional)
document.addEventListener('click', (e) => {
    if (window.innerWidth < 1024) {
        if (!navToggle.contains(e.target) && !navLinks.contains(e.target)) {
            if (navLinks.classList.contains('active')) {
                toggleMenu();
            }
        }
    }
});
</script>
